<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Situaciones Especiales — Board de Arbitraje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:       #0b0e14;
    --bg-grad:  radial-gradient(1100px 500px at 50% -8%, rgba(46,224,163,.07), transparent 60%);
    --card:     #12161f;
    --card-hi:  #171c27;
    --line:     #232a38;
    --ink:      #e8ecf3;
    --ink-dim:  #7c8698;
    --accent:   #2ee0a3;
    --accent-dim: rgba(46,224,163,.12);
    --green:    #2ee0a3;
    --green-bg: rgba(46,224,163,.10);
    --red:      #ff5470;
    --red-bg:   rgba(255,84,112,.10);
    --amber:    #ffb648;
    --amber-bg: rgba(255,182,72,.10);
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  ::selection{ background:var(--accent-dim); color:var(--ink); }
  body{
    background:var(--bg) var(--bg-grad); color:var(--ink); font-family:var(--font-body);
    padding:26px 16px 60px; display:flex; flex-direction:column; align-items:center; gap:20px;
    min-height:100vh;
  }
  .wrap{ width:100%; max-width:880px; display:flex; flex-direction:column; gap:20px; }

  /* ── HEADER ─────────────────────────────────── */
  .topbar{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .topbar h1{ font-size:1.25rem; font-weight:700; letter-spacing:-.01em; }
  .topbar h1::before{
    content:''; display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--accent); margin-right:9px; box-shadow:0 0 0 3px var(--accent-dim), 0 0 10px rgba(46,224,163,.7);
  }
  .topbar .sub{ font-size:.8rem; color:var(--ink-dim); margin-top:2px; font-family:var(--font-mono); }
  .cfg{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 12px; }
  .cfg label{ font-size:.68rem; color:var(--ink-dim); font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-right:5px; }
  .cfg select{
    font-family:var(--font-mono); font-size:.85rem; border:1px solid var(--line); border-radius:6px;
    padding:4px 7px; background:#0c0f16; color:var(--ink); outline:none; cursor:pointer;
  }
  .cfg select:focus{ border-color:var(--accent); }
  .btn{
    background:var(--accent); color:#08130f; border:none; font-weight:700; font-size:.82rem;
    padding:8px 16px; border-radius:7px; cursor:pointer; letter-spacing:.01em;
  }
  .btn:hover{ opacity:.88; }

  /* ── BOARD HEADER ROW (column labels, terminal-style) ── */
  .board{ display:flex; flex-direction:column; gap:10px; }
  .board-head{
    display:grid; grid-template-columns:38px 1fr 108px 108px 92px;
    padding:0 20px; font-size:.66rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.07em; color:var(--ink-dim); font-family:var(--font-mono);
  }
  .board-head span:nth-child(3), .board-head span:nth-child(4){ text-align:right; }
  .board-head span:nth-child(5){ text-align:center; }

  /* ── SITUATION ROW ──────────────────────────── */
  .situation{
    display:grid; grid-template-columns:38px 1fr 108px 108px 92px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 20px; cursor:pointer; text-decoration:none; color:inherit;
    transition:border-color .18s, background .18s, transform .12s;
  }
  .situation:hover{ border-color:#333c4d; background:var(--card-hi); transform:translateY(-1px); }
  .situation.armed{ border-color:var(--green); box-shadow:0 0 0 1px rgba(46,224,163,.12); }
  .situation.armed:hover{ border-color:var(--green); }

  .s-rank{ font-family:var(--font-mono); font-weight:700; color:var(--ink-dim); font-size:.92rem; }
  .situation.armed .s-rank{ color:var(--accent); }

  .s-name{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .s-pair{ font-weight:700; font-size:.95rem; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .s-pair .arrow{ color:var(--ink-dim); font-weight:400; }
  .s-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .s-tag{ font-family:var(--font-mono); font-size:.66rem; color:var(--ink-dim); background:#1c2230; padding:2px 6px; border-radius:4px; }
  .s-meta{ font-size:.72rem; color:var(--ink-dim); font-family:var(--font-mono); }

  .s-spread{ text-align:right; font-family:var(--font-mono); font-weight:800; font-size:1.3rem; }
  .s-spread.up{ color:var(--green); }
  .s-spread.down{ color:var(--red); }
  .s-spread.pending{ color:var(--ink-dim); font-weight:600; font-size:1rem; }

  .s-threshold{ text-align:right; font-family:var(--font-mono); font-size:.76rem; color:var(--ink-dim); }
  .s-threshold b{ color:var(--ink); font-weight:600; }

  .s-status{ display:flex; justify-content:center; }
  .s-badge{
    font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:4px 9px; border-radius:20px; font-family:var(--font-mono); white-space:nowrap;
  }
  .s-badge.hit{ background:var(--green); color:#08130f; }
  .s-badge.wait{ background:#1c2230; color:var(--ink-dim); }
  .s-badge.stale{ background:var(--amber-bg); color:var(--amber); }

  /* ── SOON CARD (placeholder for future situations) ── */
  .soon{
    display:flex; align-items:center; justify-content:center; gap:8px;
    border:1px dashed var(--line); border-radius:12px; padding:16px 20px;
    color:var(--ink-dim); font-size:.8rem; font-family:var(--font-mono);
  }

  #status{ font-family:var(--font-mono); font-size:.72rem; color:var(--ink-dim); text-align:center; }
  .status-ok{ color:var(--green); }
  #footer-credit{
    font-size:.72rem; color:var(--ink-dim); text-align:center; letter-spacing:.02em;
    margin-top:-6px; padding-top:14px; border-top:1px solid var(--line); width:100%;
  }

  @media(max-width:640px){
    .board-head{ display:none; }
    .situation{ grid-template-columns:28px 1fr; grid-template-rows:auto auto; row-gap:10px; padding:14px 16px; }
    .s-spread{ grid-column:2; text-align:left; font-size:1.5rem; }
    .s-threshold{ grid-column:2; text-align:left; }
    .s-status{ grid-column:2; justify-content:flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1>Situaciones Especiales</h1>
      <div class="sub">Board de arbitraje de fusiones — spread de entrada en vivo</div>
    </div>
    <div class="cfg">
      <label>Refresco</label>
      <select id="auto-interval">
        <option value="10000" selected>10s</option>
        <option value="30000">30s</option>
        <option value="60000">1min</option>
        <option value="0">Off</option>
      </select>
      <button class="btn" onclick="updateBoard()">Actualizar</button>
    </div>
  </div>

  <div class="board">
    <div class="board-head">
      <span>#</span>
      <span>Situación</span>
      <span>Spread</span>
      <span>Umbral</span>
      <span>Estado</span>
    </div>
    <div id="board-body"><!-- filas insertadas por JS --></div>

    <div class="soon">+ añade más situaciones editando el array SITUATIONS en el código</div>
  </div>

  <div id="status">Iniciando…</div>
  <div id="footer-credit">Monitor de arbitraje de situaciones especiales por Todd Lott y Phyera</div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// CONFIG — añade una entrada por cada situación especial que quieras
// listar. "detailUrl" debe apuntar al monitor detallado de esa
// situación (una página como tmrc-usar.html).
// ════════════════════════════════════════════════════════════════
const DATA_URL = 'https://zkpvhtaktowevholyasa.supabase.co';
const DATA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprcHZodGFrdG93ZXZob2x5YXNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MjcyMTMsImV4cCI6MjEwMDQwMzIxM30.0NMyJAPX7A4x6don1PB4siDpNtvU3bOiZruM9GwRd84';
const db = supabase.createClient(DATA_URL, DATA_KEY);

const INVALID_TICK = -1;
const STALE_MS = 60000;

const SITUATIONS = [
  {
    id: 'tmrc-usar',
    targetSymbol: 'TMRC',
    targetName: 'Texas Mineral',
    acquirerSymbol: 'USAR',
    acquirerName: 'USA Rare Earth',
    ratio: 3823328 / 88339693,
    threshold: 9,       // % — umbral de entrada de esta situación
    detailUrl: 'tmrc-usar.html',
  },
  // Añade más situaciones aquí, por ejemplo:
  // {
  //   id: 'foo-bar',
  //   targetSymbol: 'FOO', targetName: 'Foo Corp',
  //   acquirerSymbol: 'BAR', acquirerName: 'Bar Inc',
  //   ratio: 0.5, threshold: 7,
  //   detailUrl: 'foo-bar.html',
  // },
];

let autoTimer = null;

function cleanQuote(v){
  const n = parseFloat(v);
  if(isNaN(n) || n === INVALID_TICK) return NaN;
  return n;
}

function fmtPct(n,d=2){ return (n*100).toFixed(d)+' %'; }

function tiempoDesde(iso){
  if(!iso) return {texto:'sin datos', stale:true};
  const ms = Date.now()-new Date(iso).getTime();
  const stale = ms > STALE_MS;
  if(ms<1000) return {texto:'justo ahora', stale};
  if(ms<60000) return {texto:`hace ${Math.round(ms/1000)}s`, stale};
  return {texto:`hace ${Math.round(ms/60000)} min`, stale};
}

async function fetchAllQuotes(symbols){
  const { data, error } = await db
    .from('latest_quotes_by_symbol')
    .select('*')
    .in('symbol', symbols);
  if(error) throw error;
  const bySymbol = {};
  (data||[]).forEach(r => bySymbol[r.symbol] = r);
  return bySymbol;
}

function renderRow(sit, computed){
  const { inPct, aExch, tExch, freshest } = computed;

  const hasSpread = !isNaN(inPct);
  const spreadClass = !hasSpread ? 'pending' : (inPct >= 0 ? 'up' : 'down');
  const spreadText = hasSpread ? fmtPct(inPct) : 'sin datos';

  const fr = tiempoDesde(freshest);
  const hit = hasSpread && (inPct*100) >= sit.threshold;

  let badgeClass = 'wait', badgeText = 'esperando';
  if(fr.stale){ badgeClass = 'stale'; badgeText = 'desfasado'; }
  else if(hit){ badgeClass = 'hit'; badgeText = '✓ señal'; }

  return `
    <a class="situation ${hit && !fr.stale ? 'armed' : ''}" href="${sit.detailUrl}">
      <div class="s-rank">${computed.rank}</div>
      <div class="s-name">
        <div class="s-pair">${sit.targetName} <span class="arrow">→</span> ${sit.acquirerName}</div>
        <div class="s-tags">
          <span class="s-tag">${sit.targetSymbol}${tExch ? ' · '+tExch : ''}</span>
          <span class="s-tag">${sit.acquirerSymbol}${aExch ? ' · '+aExch : ''}</span>
        </div>
        <div class="s-meta">${fr.texto}</div>
      </div>
      <div class="s-spread ${spreadClass}">${spreadText}</div>
      <div class="s-threshold">entra en <b>${sit.threshold}%</b></div>
      <div class="s-status"><span class="s-badge ${badgeClass}">${badgeText}</span></div>
    </a>
  `;
}

async function updateBoard(){
  const status = document.getElementById('status');
  const body = document.getElementById('board-body');

  try{
    const allSymbols = [...new Set(SITUATIONS.flatMap(s => [s.targetSymbol, s.acquirerSymbol]))];
    const bySymbol = await fetchAllQuotes(allSymbols);

    const computedList = SITUATIONS.map(sit => {
      const t = bySymbol[sit.targetSymbol] || {};
      const a = bySymbol[sit.acquirerSymbol] || {};
      const aBid = cleanQuote(a.bid);
      const tAsk = cleanQuote(t.ask);

      let inPct = NaN;
      if(!isNaN(aBid) && !isNaN(tAsk) && tAsk>0){
        inPct = (sit.ratio*aBid)/tAsk - 1;
      }

      const stamps = [t.ib_timestamp || t.inserted_at, a.ib_timestamp || a.inserted_at]
        .filter(Boolean).map(x => new Date(x).getTime());
      const freshest = stamps.length ? new Date(Math.max(...stamps)).toISOString() : null;

      return { sit, inPct, aExch: a.primary_exchange, tExch: t.primary_exchange, freshest };
    });

    // Orden por rentabilidad de entrada, de mayor a menor (las que no
    // tienen dato válido se quedan al final).
    computedList.sort((x,y)=>{
      if(isNaN(x.inPct) && isNaN(y.inPct)) return 0;
      if(isNaN(x.inPct)) return 1;
      if(isNaN(y.inPct)) return -1;
      return y.inPct - x.inPct;
    });

    body.innerHTML = computedList
      .map((c, i) => renderRow(c.sit, { ...c, rank: String(i+1).padStart(2,'0') }))
      .join('');

    status.innerHTML = `<span class="status-ok">Actualizado</span> · ${new Date().toLocaleTimeString()}`;
  }catch(e){
    status.innerText = 'Error al consultar datos: ' + e.message;
  }
}

document.getElementById('auto-interval').addEventListener('change', startAuto);
function startAuto(){
  clearInterval(autoTimer);
  const ms = parseInt(document.getElementById('auto-interval').value);
  if(ms>0) autoTimer = setInterval(updateBoard, ms);
}

window.onload = async () => {
  await updateBoard();
  startAuto();
};
</script>
</body>
</html>
