<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Situaciones Especiales — Board de Arbitraje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:       #0b0e14;
    --bg-grad:  radial-gradient(1100px 500px at 50% -8%, rgba(46,224,163,.07), transparent 60%);
    --card:     #12161f;
    --card-hi:  #171c27;
    --line:     #232a38;
    --ink:      #e8ecf3;
    --ink-dim:  #7c8698;
    --accent:   #2ee0a3;
    --accent-dim: rgba(46,224,163,.12);
    --green:    #2ee0a3;
    --green-bg: rgba(46,224,163,.10);
    --red:      #ff5470;
    --red-bg:   rgba(255,84,112,.10);
    --amber:    #ffb648;
    --amber-bg: rgba(255,182,72,.10);
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  ::selection{ background:var(--accent-dim); color:var(--ink); }
  body{
    background:var(--bg) var(--bg-grad); color:var(--ink); font-family:var(--font-body);
    padding:26px 16px 60px; display:flex; flex-direction:column; align-items:center; gap:20px;
    min-height:100vh;
  }
  .wrap{ width:100%; max-width:880px; display:flex; flex-direction:column; gap:20px; }

  /* ── HEADER ─────────────────────────────────── */
  .topbar{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .topbar h1{ font-size:1.25rem; font-weight:700; letter-spacing:-.01em; }
  .topbar h1::before{
    content:''; display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--accent); margin-right:9px; box-shadow:0 0 0 3px var(--accent-dim), 0 0 10px rgba(46,224,163,.7);
  }
  .topbar .sub{ font-size:.8rem; color:var(--ink-dim); margin-top:2px; font-family:var(--font-mono); }
  .cfg{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 12px; }
  .cfg label{ font-size:.68rem; color:var(--ink-dim); font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-right:5px; }
  .cfg select{
    font-family:var(--font-mono); font-size:.85rem; border:1px solid var(--line); border-radius:6px;
    padding:4px 7px; background:#0c0f16; color:var(--ink); outline:none; cursor:pointer;
  }
  .cfg select:focus{ border-color:var(--accent); }
  .btn{
    background:var(--accent); color:#08130f; border:none; font-weight:700; font-size:.82rem;
    padding:8px 16px; border-radius:7px; cursor:pointer; letter-spacing:.01em;
  }
  .btn:hover{ opacity:.88; }

  /* ── BOARD HEADER ROW (column labels, terminal-style) ── */
  .board{ display:flex; flex-direction:column; gap:10px; }
  .board-head{
    display:grid; grid-template-columns:38px 1fr 150px 150px;
    padding:0 20px; font-size:.66rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.07em; color:var(--ink-dim); font-family:var(--font-mono);
  }
  .board-head span:nth-child(3), .board-head span:nth-child(4){ text-align:center; }

  /* ── SITUATION ROW (ya no es <a>: la navegación se dispara por JS
       y se ignora si el click viene de un input/botón interactivo) ── */
  .situation{
    display:grid; grid-template-columns:38px 1fr 150px 150px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 20px; cursor:pointer; gap:10px;
    transition:border-color .18s, background .18s, transform .12s;
  }
  .situation:hover{ border-color:#333c4d; background:var(--card-hi); transform:translateY(-1px); }
  .situation.armed-exit{ border-color:var(--amber); }
  .situation.armed{ border-color:var(--green); box-shadow:0 0 0 1px rgba(46,224,163,.12); }
  .situation.armed:hover{ border-color:var(--green); }

  .s-rank{ font-family:var(--font-mono); font-weight:700; color:var(--ink-dim); font-size:.92rem; }
  .situation.armed .s-rank{ color:var(--accent); }

  .s-name{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .s-pair{ font-weight:700; font-size:.95rem; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .s-pair .arrow{ color:var(--ink-dim); font-weight:400; }
  .s-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .s-tag{ font-family:var(--font-mono); font-size:.66rem; color:var(--ink-dim); background:#1c2230; padding:2px 6px; border-radius:4px; }
  .s-meta{ font-size:.72rem; color:var(--ink-dim); font-family:var(--font-mono); }

  /* ── BLOQUE ENTRADA / SALIDA: spread + umbral + alarma juntos ── */
  .s-side{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .side-spread{ font-family:var(--font-mono); font-weight:800; font-size:1.15rem; padding:1px 6px; }
  .side-spread.up{ color:var(--green); }
  .side-spread.down{ color:var(--red); }
  .side-spread.pending{ color:var(--ink-dim); font-weight:600; font-size:.9rem; }
  .side-ctrl{ display:flex; align-items:center; gap:6px; }
  .side-ctrl .th-input{
    width:48px; font-family:var(--font-mono); font-size:.78rem; font-weight:600; color:var(--ink);
    background:#0c0f16; border:1px solid var(--line); border-radius:6px; padding:3px 5px;
    outline:none; text-align:center;
  }
  .side-ctrl .th-input:focus{ border-color:var(--accent); }

  .sound-btn{
    flex:0 0 auto; width:28px; height:28px; border-radius:8px;
    border:1px solid var(--line); background:#0c0f16; color:var(--ink-dim); font-size:.85rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .18s; line-height:1;
  }
  .sound-btn:hover{ border-color:var(--ink-dim); color:var(--ink); }
  .sound-btn.active{
    background:var(--accent-dim); border-color:var(--accent); color:var(--accent);
    box-shadow:0 0 0 3px rgba(46,224,163,.12);
  }
  .sound-btn.exit.active{
    background:var(--amber-bg); border-color:var(--amber); color:var(--amber);
    box-shadow:0 0 0 3px rgba(255,182,72,.12);
  }
  .sound-btn.alerting{
    background:var(--amber-bg); border-color:var(--amber); color:var(--amber);
    animation:soundPulse 1s ease-in-out infinite;
  }
  @keyframes soundPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,182,72,.45); }
    50%{ box-shadow:0 0 0 7px rgba(255,182,72,0); }
  }

  #status{ font-family:var(--font-mono); font-size:.72rem; color:var(--ink-dim); text-align:center; }
  .status-ok{ color:var(--green); }
  #footer-credit{
    font-size:.72rem; color:var(--ink-dim); text-align:center; letter-spacing:.02em;
    margin-top:-6px; padding-top:14px; border-top:1px solid var(--line); width:100%;
  }

  @media(max-width:640px){
    .board-head{ display:none; }
    .situation{ grid-template-columns:1fr 1fr; grid-template-rows:auto auto; row-gap:12px; padding:14px 16px; }
    .s-name{ grid-column:1 / -1; }
  }

  /* ── RESPLANDOR AL CAMBIAR UN VALOR (estilo broker) ──
     Las filas se regeneran por completo en cada refresco (innerHTML),
     así que el "cambio" no se detecta comparando el DOM, sino que se
     decide de antemano en JS (comparando con el valor anterior) y se
     inserta ya con la clase puesta: al insertar un nodo nuevo con esta
     clase, la animación se dispara igualmente desde el principio. */
  .value-flash{
    border-radius:4px;
    animation: valueGlow .9s ease-out;
  }
  @keyframes valueGlow{
    0%{
      box-shadow:0 0 0 0 var(--glow-color, rgba(255,255,255,.5));
      background:var(--glow-bg, rgba(255,255,255,.16));
    }
    100%{
      box-shadow:0 0 0 10px rgba(0,0,0,0);
      background:transparent;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1>Situaciones Especiales</h1>
      <div class="sub">Board de arbitraje de fusiones — spread de entrada en vivo</div>
    </div>
    <div class="cfg">
      <label>Refresco</label>
      <select id="auto-interval">
        <option value="10000" selected>10s</option>
        <option value="30000">30s</option>
        <option value="60000">1min</option>
        <option value="0">Off</option>
      </select>
      <button class="btn" onclick="updateBoard()">Actualizar</button>
    </div>
  </div>

  <div class="board">
    <div class="board-head">
      <span>#</span>
      <span>Situación</span>
      <span>Entrada</span>
      <span>Salida</span>
    </div>
    <div id="board-body"><!-- filas insertadas por JS --></div>
  </div>

  <div id="status">Iniciando…</div>
  <div id="footer-credit">Monitor de arbitraje de situaciones especiales por Todd Lott y Phyera</div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// CONFIG — añade una entrada por cada situación especial que quieras
// listar. "detailUrl" debe apuntar al monitor detallado de esa
// situación (una página como tmrc-usar.html).
// ════════════════════════════════════════════════════════════════
const DATA_URL = 'https://zkpvhtaktowevholyasa.supabase.co';
const DATA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprcHZodGFrdG93ZXZob2x5YXNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MjcyMTMsImV4cCI6MjEwMDQwMzIxM30.0NMyJAPX7A4x6don1PB4siDpNtvU3bOiZruM9GwRd84';
const db = supabase.createClient(DATA_URL, DATA_KEY);

const INVALID_TICK = -1;
const STALE_MS = 60000;

const SITUATIONS = [
  {
    id: 'tmrc-usar',
    type: 'ratio',            // canje de acciones: dos símbolos + ratio de canje
    targetSymbol: 'TMRC',
    targetName: 'Texas Mineral',

    acquirerName: 'USA Rare Earth',
    ratio: 3823328 / 88339693,
    threshold: 9,        // % — umbral de entrada de esta situación
    thresholdExit: 5,    // % — umbral de salida de esta situación
    detailUrl: 'tmrc-usar.html',
  },
  {
    id: 'gbcs',
    type: 'fixed',             // OPA en efectivo: un solo símbolo + precio de oferta fijo
    targetSymbol: 'GBCS',
    targetName: 'Selectis Health (GBCS)',
    acquirerName: 'Black Pearl Equities (efectivo)',
    offerPrice: 5.75,    // $ por acción en efectivo, según el Merger Agreement
    threshold: 6,        // % — umbral de entrada de esta situación
    thresholdExit: 2,    // % — umbral de salida de esta situación
    detailUrl: 'gbcs.html',
  },
  {
    id: 'nee-d',
    type: 'ratio_cash',       // canje de acciones + cash sweetener fijo por acción
    targetSymbol: 'D',
    targetName: 'Dominion Energy',
    acquirerSymbol: 'NEE',
    acquirerName: 'NextEra Energy',
    ratio: 0.8138,
    cashPerShare: 0.42,  // $360M / ~853-865M acciones de D en circulación (aprox., confirmar en el S-4)
    threshold: 4,        // % — umbral de entrada de esta situación
    thresholdExit: 1,    // % — umbral de salida de esta situación
    detailUrl: 'nee-d.html',
  },
  {
    id: 'ionq-skyt',
    type: 'ratio_cash_collar', // canje de acciones a ratio CON COLLAR + cash fijo por acción
    targetSymbol: 'SKYT',
    targetName: 'SkyWater Technology',
    acquirerSymbol: 'IONQ',
    acquirerName: 'IonQ',
    cashPerShare: 15.00,   // $ fijo por acción SKYT
    stockValueTarget: 20.00, // $ objetivo del componente en acciones dentro de la banda del collar
    collarHigh: 60.13,     // $ — VWAP de IONQ a partir de aquí -> ratio fijo bajo
    collarLow: 37.99,      // $ — VWAP de IONQ por debajo de aquí -> ratio fijo alto
    ratioAtHigh: 0.3326,   // acciones IONQ/SKYT si VWAP >= collarHigh
    ratioAtLow: 0.5265,    // acciones IONQ/SKYT si VWAP <= collarLow
    vwapScenario: 'flotante', // 'flotante' (usa el precio actual como proxy) | 'alto' | 'bajo'
    threshold: 6,        // % — umbral de entrada de esta situación
    thresholdExit: 2,    // % — umbral de salida de esta situación
    detailUrl: 'ionq-skyt.html',
  },
  {
    id: 'smwn',
    type: 'fixed',             // OPA en efectivo: un solo símbolo + precio de oferta fijo (IBIS, EUR)
    targetSymbol: 'SMWN',
    targetName: 'SMWN (IBIS, EUR)',
    acquirerName: 'Oferta en efectivo (€4.60)',
    offerPrice: 4.60,    // € por acción, oferta sobre la mesa
    threshold: 4.55,     // % — equivale aprox. a un ask de €4.40 (umbral de entrada solicitado)
    thresholdExit: 1.5,  // % — umbral de salida orientativo (no hay lógica de salida específica pedida)
    detailUrl: 'smwn.html',
  },
];

// Ratio de canje IONQ/SKYT dado un precio de referencia de IONQ (bid o
// ask, según la pata) y el escenario de VWAP configurado en la propia
// situación (sit.vwapScenario). 'flotante' usa el precio actual como
// proxy del VWAP de 20 días, recortando a los ratios fijos del collar
// si el precio sale de la banda [collarLow, collarHigh].
function computeCollarRatio(sit, precioAdquirente){
  const scenario = sit.vwapScenario || 'flotante';
  if(scenario === 'alto') return sit.ratioAtHigh;
  if(scenario === 'bajo') return sit.ratioAtLow;
  if(isNaN(precioAdquirente) || precioAdquirente<=0) return NaN;
  if(precioAdquirente >= sit.collarHigh) return sit.ratioAtHigh;
  if(precioAdquirente <= sit.collarLow) return sit.ratioAtLow;
  return sit.stockValueTarget / precioAdquirente;
}

let autoTimer = null;
let lastComputedList = [];

// Último spread (en %, ya multiplicado por 100) mostrado para cada
// situación, para poder decidir si el nuevo valor sube o baja y así
// disparar el resplandor con el color correcto en el próximo render.
let lastShownSpread = {};   // { [situationId]: { in: number, out: number } }

// ── Aviso sonoro por situación ──
// Cada fila se "arma" de forma independiente. En cuanto su spread de
// entrada supera el umbral, el aviso suena EN BUCLE indefinidamente
// —no se detiene solo aunque la condición deje de cumplirse— hasta
// que el usuario desactiva esa fila manualmente.
let soundArmed = {};      // { [situationId]: boolean }
let alarmInterval = {};   // { [situationId]: intervalId }
const ALARM_LOOP_MS = 1300;
let sharedAudioCtx = null;

function getAudioCtx(){
  if(!sharedAudioCtx){
    sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume();
  return sharedAudioCtx;
}

function beep(freq, delay, duration){
  const ac = getAudioCtx();
  const start = ac.currentTime + delay;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(0.35, start + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  o.connect(g); g.connect(ac.destination);
  o.start(start);
  o.stop(start + duration + 0.05);
}

function playAlertSound(){
  // Dos tonos ascendentes, igual que la señal de entrada del monitor detallado.
  beep(740, 0,   0.28);
  beep(1180, 0.16, 0.32);
}

function startAlarmLoop(id){
  if(alarmInterval[id]) return; // ya está sonando
  playAlertSound();
  alarmInterval[id] = setInterval(playAlertSound, ALARM_LOOP_MS);
}

function stopAlarmLoop(id){
  if(alarmInterval[id]){
    clearInterval(alarmInterval[id]);
    alarmInterval[id] = null;
  }
}

function toggleSound(id, ev){
  ev.preventDefault();
  ev.stopPropagation();
  soundArmed[id] = !soundArmed[id];
  if(soundArmed[id]){
    getAudioCtx(); // desbloquea el audio en el gesto del usuario
  } else {
    stopAlarmLoop(id); // desactivación manual: para el bucle si estaba sonando
  }
  // Refleja el nuevo estado en el botón sin esperar al próximo refresco de datos
  const btn = document.getElementById('sound-'+id);
  if(btn){
    btn.classList.toggle('active', !!soundArmed[id]);
    btn.classList.toggle('alerting', !!alarmInterval[id]);
  }
}

function triggerSignalSound(id, isHit){
  if(isHit && soundArmed[id]){
    startAlarmLoop(id); // arranca el bucle; seguirá hasta apagado manual
  }
}

// La fila entera es "clicable" para ir al detalle, pero si el click
// (o el Enter) viene de un input, botón o label —umbrales, alarmas—
// se ignora la navegación. Así los controles nunca abren el detalle,
// incluso con las flechitas del spinner del <input type="number">.
function goToDetail(ev, url){
  if(ev.target.closest('input, button, label, select')) return;
  window.location.href = url;
}
function goToDetailKey(ev, url){
  if(ev.key !== 'Enter' && ev.key !== ' ') return;
  if(ev.target.closest('input, button, label, select')) return;
  ev.preventDefault();
  window.location.href = url;
}

// Cambia el umbral de una situación desde el input de la fila. No
// vuelve a consultar Supabase: recalcula con los últimos datos ya
// cargados (lastComputedList) para no perder el foco del input.
function updateThreshold(id, kind, val){
  const sit = SITUATIONS.find(s => s.id === id);
  if(!sit) return;
  const num = Math.round(parseFloat(val));
  if(kind === 'entry') sit.threshold = isNaN(num) ? 0 : num;
  else sit.thresholdExit = isNaN(num) ? 0 : num;
  updateRowVisuals(id);
}

function updateRowVisuals(id){
  const c = lastComputedList.find(x => x.sit.id === id);
  if(!c) return;
  const sit = c.sit;

  const hit = !isNaN(c.inPct) && (c.inPct*100) >= sit.threshold;
  const exitHit = !isNaN(c.outPct) && (c.outPct*100) <= sit.thresholdExit;
  const live = !c.fr.stale;

  triggerSignalSound(id+'-entry', hit && live);
  triggerSignalSound(id+'-exit', exitHit && live);

  const row = document.getElementById('row-'+id);
  if(row){
    row.classList.toggle('armed', hit && live);
    row.classList.toggle('armed-exit', exitHit && live && !(hit && live));
  }

  const entryBtn = document.getElementById('sound-'+id+'-entry');
  const exitBtn = document.getElementById('sound-'+id+'-exit');
  if(entryBtn) entryBtn.classList.toggle('alerting', !!alarmInterval[id+'-entry']);
  if(exitBtn) exitBtn.classList.toggle('alerting', !!alarmInterval[id+'-exit']);
}

function cleanQuote(v){
  const n = parseFloat(v);
  if(isNaN(n) || n === INVALID_TICK) return NaN;
  return n;
}

function fmtPct(n,d=2){ return (n*100).toFixed(d)+' %'; }

function tiempoDesde(iso){
  if(!iso) return {texto:'sin datos', stale:true};
  const ms = Date.now()-new Date(iso).getTime();
  const stale = ms > STALE_MS;
  if(ms<1000) return {texto:'justo ahora', stale};
  if(ms<60000) return {texto:`hace ${Math.round(ms/1000)}s`, stale};
  return {texto:`hace ${Math.round(ms/60000)} min`, stale};
}

async function fetchAllQuotes(symbols){
  const { data, error } = await db
    .from('latest_quotes_by_symbol')
    .select('*')
    .in('symbol', symbols);
  if(error) throw error;
  const bySymbol = {};
  (data||[]).forEach(r => bySymbol[r.symbol] = r);
  return bySymbol;
}

// Calcula, para un valor nuevo frente al último mostrado, qué clase de
// resplandor debe llevar el elemento y con qué variables de color, ya
// listas para insertar directamente en el HTML de la fila.
function flashAttrs(id, field, newVal){
  if(isNaN(newVal)) return '';
  const prevStore = lastShownSpread[id];
  const prev = prevStore ? prevStore[field] : undefined;
  if(prev === undefined || isNaN(prev) || newVal === prev) return '';
  const up = newVal > prev;
  const color = up ? 'rgba(46,224,163,.65)' : 'rgba(255,84,112,.65)';
  const bg    = up ? 'rgba(46,224,163,.18)' : 'rgba(255,84,112,.18)';
  return ` value-flash" style="--glow-color:${color}; --glow-bg:${bg};`;
}

function renderRow(sit, computed){
  const { inPct, outPct, aExch, tExch, fr } = computed;

  const hasIn = !isNaN(inPct);
  const inClass = !hasIn ? 'pending' : (inPct >= 0 ? 'up' : 'down');
  const inText = hasIn ? fmtPct(inPct) : 'sin datos';
  const inFlash = hasIn ? flashAttrs(sit.id, 'in', inPct) : '';

  const hasOut = !isNaN(outPct);
  const outClass = !hasOut ? 'pending' : (outPct > 0 ? 'down' : 'up');
  const outText = hasOut ? fmtPct(outPct) : 'sin datos';
  const outFlash = hasOut ? flashAttrs(sit.id, 'out', outPct) : '';

  const hit = hasIn && (inPct*100) >= sit.threshold;
  const exitHit = hasOut && (outPct*100) <= sit.thresholdExit;
  const live = !fr.stale;

  const entryArmedManually = !!soundArmed[sit.id+'-entry'];
  const entryAlerting = !!alarmInterval[sit.id+'-entry'];
  const exitArmedManually = !!soundArmed[sit.id+'-exit'];
  const exitAlerting = !!alarmInterval[sit.id+'-exit'];

  let borderClass = '';
  if(hit && live) borderClass = 'armed';
  else if(exitHit && live) borderClass = 'armed-exit';

  return `
    <div class="situation ${borderClass}" id="row-${sit.id}" tabindex="0" role="link"
      onclick="goToDetail(event, '${sit.detailUrl}')" onkeydown="goToDetailKey(event, '${sit.detailUrl}')">
      <div class="s-rank">${computed.rank}</div>
      <div class="s-name">
        <div class="s-pair">${sit.targetName} <span class="arrow">→</span> ${sit.acquirerName}</div>
        <div class="s-tags">
          <span class="s-tag">${sit.targetSymbol}${tExch ? ' · '+tExch : ''}</span>
          ${sit.acquirerSymbol ? `<span class="s-tag">${sit.acquirerSymbol}${aExch ? ' · '+aExch : ''}</span>` : `<span class="s-tag">OPA en efectivo</span>`}
        </div>
        <div class="s-meta">${fr.texto}</div>
      </div>

      <div class="s-side">
        <div class="side-spread ${inClass}${inFlash}">${inText}</div>
        <div class="side-ctrl">
          <input class="th-input" type="number" step="1" value="${sit.threshold}"
            onclick="event.stopPropagation()" oninput="updateThreshold('${sit.id}','entry',this.value)">
          <button class="sound-btn ${entryArmedManually?'active':''} ${entryAlerting?'alerting':''}" id="sound-${sit.id}-entry"
            onclick="toggleSound('${sit.id}-entry', event)"
            title="Avisar con sonido en bucle cuando el spread de entrada supere el umbral (suena hasta que lo desactives)">🔔</button>
        </div>
      </div>

      <div class="s-side">
        <div class="side-spread ${outClass}${outFlash}">${outText}</div>
        <div class="side-ctrl">
          <input class="th-input" type="number" step="1" value="${sit.thresholdExit}"
            onclick="event.stopPropagation()" oninput="updateThreshold('${sit.id}','exit',this.value)">
          <button class="sound-btn exit ${exitArmedManually?'active':''} ${exitAlerting?'alerting':''}" id="sound-${sit.id}-exit"
            onclick="toggleSound('${sit.id}-exit', event)"
            title="Avisar con sonido en bucle cuando el spread de salida cruce el umbral (suena hasta que lo desactives)">🔔</button>
        </div>
      </div>
    </div>
  `;
}

async function updateBoard(){
  const status = document.getElementById('status');
  const body = document.getElementById('board-body');

  try{
    const allSymbols = [...new Set(SITUATIONS.flatMap(s => s.acquirerSymbol ? [s.targetSymbol, s.acquirerSymbol] : [s.targetSymbol]))];
    const bySymbol = await fetchAllQuotes(allSymbols);

    const computedList = SITUATIONS.map(sit => {
      const t = bySymbol[sit.targetSymbol] || {};
      let inPct = NaN, outPct = NaN, aExch = null, freshestStamps = [];

      if(sit.type === 'fixed'){
        // OPA en efectivo: spread = precio de oferta fijo / ask (o bid) - 1
        const ask = cleanQuote(t.ask);
        const bid = cleanQuote(t.bid);
        if(!isNaN(ask) && ask>0) inPct = sit.offerPrice/ask - 1;
        if(!isNaN(bid) && bid>0) outPct = sit.offerPrice/bid - 1;
        freshestStamps = [t.ib_timestamp || t.inserted_at];
      } else if(sit.type === 'ratio_cash'){
        // Canje de acciones + cash fijo por acción (ratio constante):
        // spread = (ratio*precio_adquirente + cashPerShare) / precio_objetivo - 1
        const a = bySymbol[sit.acquirerSymbol] || {};
        const aBid = cleanQuote(a.bid);
        const aAsk = cleanQuote(a.ask);
        const tBid = cleanQuote(t.bid);
        const tAsk = cleanQuote(t.ask);
        if(!isNaN(aBid) && !isNaN(tAsk) && tAsk>0) inPct = (sit.ratio*aBid + sit.cashPerShare)/tAsk - 1;
        if(!isNaN(aAsk) && !isNaN(tBid) && tBid>0) outPct = (sit.ratio*aAsk + sit.cashPerShare)/tBid - 1;
        aExch = a.primary_exchange;
        freshestStamps = [t.ib_timestamp || t.inserted_at, a.ib_timestamp || a.inserted_at];
      } else if(sit.type === 'ratio_cash_collar'){
        // Canje de acciones a ratio CON COLLAR (el ratio depende del precio
        // del adquirente según sit.vwapScenario) + cash fijo por acción:
        // spread = (ratio(precio)*precio_adquirente + cashPerShare) / precio_objetivo - 1
        const a = bySymbol[sit.acquirerSymbol] || {};
        const aBid = cleanQuote(a.bid);
        const aAsk = cleanQuote(a.ask);
        const tBid = cleanQuote(t.bid);
        const tAsk = cleanQuote(t.ask);
        if(!isNaN(aBid) && !isNaN(tAsk) && tAsk>0){
          const ratioIn = computeCollarRatio(sit, aBid);
          if(!isNaN(ratioIn)) inPct = (ratioIn*aBid + sit.cashPerShare)/tAsk - 1;
        }
        if(!isNaN(aAsk) && !isNaN(tBid) && tBid>0){
          const ratioOut = computeCollarRatio(sit, aAsk);
          if(!isNaN(ratioOut)) outPct = (ratioOut*aAsk + sit.cashPerShare)/tBid - 1;
        }
        aExch = a.primary_exchange;
        freshestStamps = [t.ib_timestamp || t.inserted_at, a.ib_timestamp || a.inserted_at];
      } else {
        // Canje de acciones puro: spread = ratio * precio del adquirente / precio del objetivo - 1
        const a = bySymbol[sit.acquirerSymbol] || {};
        const aBid = cleanQuote(a.bid);
        const aAsk = cleanQuote(a.ask);
        const tBid = cleanQuote(t.bid);
        const tAsk = cleanQuote(t.ask);
        if(!isNaN(aBid) && !isNaN(tAsk) && tAsk>0) inPct = (sit.ratio*aBid)/tAsk - 1;
        if(!isNaN(aAsk) && !isNaN(tBid) && tBid>0) outPct = (sit.ratio*aAsk)/tBid - 1;
        aExch = a.primary_exchange;
        freshestStamps = [t.ib_timestamp || t.inserted_at, a.ib_timestamp || a.inserted_at];
      }

      const stamps = freshestStamps.filter(Boolean).map(x => new Date(x).getTime());
      const freshest = stamps.length ? new Date(Math.max(...stamps)).toISOString() : null;

      const fr = tiempoDesde(freshest);
      const hit = !isNaN(inPct) && (inPct*100) >= sit.threshold;
      const exitHit = !isNaN(outPct) && (outPct*100) <= sit.thresholdExit;
      triggerSignalSound(sit.id+'-entry', hit && !fr.stale);
      triggerSignalSound(sit.id+'-exit', exitHit && !fr.stale);

      return { sit, inPct, outPct, aExch, tExch: t.primary_exchange, freshest, fr };
    });

    // Orden por rentabilidad de entrada, de mayor a menor (las que no
    // tienen dato válido se quedan al final).
    computedList.sort((x,y)=>{
      if(isNaN(x.inPct) && isNaN(y.inPct)) return 0;
      if(isNaN(x.inPct)) return 1;
      if(isNaN(y.inPct)) return -1;
      return y.inPct - x.inPct;
    });

    lastComputedList = computedList;

    body.innerHTML = computedList
      .map((c, i) => renderRow(c.sit, { ...c, rank: String(i+1).padStart(2,'0') }))
      .join('');

    // Guardamos los valores recién mostrados como referencia para
    // detectar la próxima subida/bajada y disparar el resplandor.
    computedList.forEach(c => {
      lastShownSpread[c.sit.id] = { in: c.inPct, out: c.outPct };
    });

    status.innerHTML = `<span class="status-ok">Actualizado</span> · ${new Date().toLocaleTimeString()}`;
  }catch(e){
    status.innerText = 'Error al consultar datos: ' + e.message;
  }
}

document.getElementById('auto-interval').addEventListener('change', startAuto);
function startAuto(){
  clearInterval(autoTimer);
  const ms = parseInt(document.getElementById('auto-interval').value);
  if(ms>0) autoTimer = setInterval(updateBoard, ms);
}

window.onload = async () => {
  await updateBoard();
  startAuto();
};
</script>
